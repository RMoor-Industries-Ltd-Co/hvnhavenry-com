name: Deploy to Calculus-Havenry

on:
  pull_request:
  push:
    branches: [main]

# main deploys stay strictly serial and uncancellable; PRs validate in
# parallel, cancelling their own superseded runs.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-hvnhavenry' || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Build & deploy
    needs: validate
    # Validate runs on PRs for pre-merge feedback; only deploy on a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          # Pass the existing GitHub Actions Drive creds through to the SSH session
          # so the deploy can write them into both apps' runtime env files. Global
          # reuses the SAME OAuth credential as Havenry (both point at the one
          # rmasters.group Google Drive OAuth identity, per hvnglobalco-com's
          # ASSETS.md) -- no separate GLOBAL_GDRIVE_* secret is needed for that.
          # What keeps the two sites' assets apart is the separate Drive folder +
          # manifest inside hvnglobalco-com, not a separate credential.
          #
          # This repo's deploy does not use Doppler today (no `doppler run`, no
          # DOPPLER_TOKEN) -- these are plain GitHub Actions repository secrets.
          # Migrating this workflow to a Doppler-backed secret model is a
          # separate, future infrastructure cleanup, not part of Phase A.
          envs: GDRIVE_CLIENT_ID,GDRIVE_CLIENT_SECRET,GDRIVE_REFRESH_TOKEN
          script: |
            set -e
            cd /srv/hvnhavenry
            git fetch origin main
            git reset --hard origin/main

            # HVN Global's app-global service (docker-compose.yml) builds from a
            # sibling checkout of rmoor-industries-ltd-co/hvnglobalco-com, the same
            # git-clone-and-build-locally approach `app` above already uses -- reusing
            # this server's existing deploy mechanism/credentials rather than standing
            # up a separate registry. Clone once, pull thereafter.
            #
            # NOTE: this uses HTTPS, matching a typical org-wide git credential
            # helper/machine-user token setup. If this server actually authenticates
            # its `git fetch origin main` above via SSH (deploy key) instead, this
            # clone needs the equivalent SSH remote URL
            # (git@github.com:RMoor-Industries-Ltd-Co/hvnglobalco-com.git) instead --
            # whichever this server already uses for THIS repo's own remote is what
            # to check first (`git remote -v` in /srv/hvnhavenry) if this step fails
            # with an auth error. Written from an environment with no server access,
            # so this could not be confirmed directly.
            if [ ! -d ../hvnglobalco-com/.git ]; then
              git clone https://github.com/RMoor-Industries-Ltd-Co/hvnglobalco-com.git ../hvnglobalco-com
            else
              git -C ../hvnglobalco-com fetch origin main
              git -C ../hvnglobalco-com reset --hard origin/main
            fi

            # Ensure the container's runtime env carries the Drive creds so the
            # startup asset-pull runs hands-free. Upsert idempotently, and only
            # when a value is actually present — never overwrite a good value
            # with an empty one (e.g. if a secret isn't synced to this workflow).
            touch .env.local
            upsert_env() {
              file="$1"; key="$2"; val="$3"
              [ -z "$val" ] && return 0
              grep -v "^${key}=" "$file" > "$file.tmp" 2>/dev/null || true
              printf '%s=%s\n' "$key" "$val" >> "$file.tmp"
              mv "$file.tmp" "$file"
            }
            upsert_env .env.local GDRIVE_CLIENT_ID "$GDRIVE_CLIENT_ID"
            upsert_env .env.local GDRIVE_CLIENT_SECRET "$GDRIVE_CLIENT_SECRET"
            upsert_env .env.local GDRIVE_REFRESH_TOKEN "$GDRIVE_REFRESH_TOKEN"

            # HVN Global's own runtime env file -- never .env.local above, per
            # docs/separation-of-concerns.md in hvnglobalco-com. Same underlying
            # GDRIVE_* credential values as .env.local (see the ssh-action env: block
            # above for why), just written into a separate file so the two apps never
            # share a config file, even though they share a credential.
            touch .env.global-preview.local
            upsert_env .env.global-preview.local GDRIVE_CLIENT_ID "$GDRIVE_CLIENT_ID"
            upsert_env .env.global-preview.local GDRIVE_CLIENT_SECRET "$GDRIVE_CLIENT_SECRET"
            upsert_env .env.global-preview.local GDRIVE_REFRESH_TOKEN "$GDRIVE_REFRESH_TOKEN"

            docker compose build app
            # force-recreate so the container picks up the refreshed env file and
            # re-runs the startup asset pull on every deploy.
            docker compose up -d --no-deps --force-recreate app

            docker compose build app-global
            # force-recreate so the container picks up the refreshed env file and
            # re-runs the startup asset pull on every deploy, same as `app` above.
            docker compose up -d --no-deps --force-recreate app-global

            # Recreate nginx too so it picks up any nginx.conf/conf.d changes (the
            # mounted files change on git reset but compose won't reload them
            # otherwise).
            docker compose up -d --force-recreate nginx

            # Observability (safe: prints key NAMES/counts, never values): confirm
            # the creds landed in the env files, and surface each app's startup
            # asset-pull result right here in the deploy log.
            echo "GDRIVE keys present in .env.local: $(grep -c '^GDRIVE_' .env.local 2>/dev/null || echo 0)"
            echo "GDRIVE keys present in .env.global-preview.local: $(grep -c '^GDRIVE_' .env.global-preview.local 2>/dev/null || echo 0)"
            sleep 5
            echo "----- hvnhavenry_app assets:pull -----"
            docker logs hvnhavenry_app 2>&1 | grep -i "assets:pull" | tail -20 || echo "(no assets:pull lines found)"
            echo "----- hvnhavenry_app_global_preview assets:pull -----"
            docker logs hvnhavenry_app_global_preview 2>&1 | tail -30 || echo "(container not found/not running)"
            echo "---------------------------------"

            docker image prune -f
            echo "✓ Deployed at $(date)"
