worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=hvn:10m rate=30r/s;

    # HVN Global gets its own zone rather than sharing `hvn` above — nginx keeps
    # rate-limit counters in shared memory keyed by client IP, so sharing a zone
    # between the two sites means one site's traffic (or a shared NAT) can throttle
    # the other's visitors. See rmoor-industries-ltd-co/hvnglobalco-com's
    # docs/deployment-linode.md and docs/separation-of-concerns.md.
    limit_req_zone $binary_remote_addr zone=hvn_global:10m rate=30r/s;

    # Phase A (preview) / Phase B (production) HVN Global vhosts live here, as
    # separate files rather than inline, so a not-yet-safe-to-activate config (e.g.
    # a server block referencing a certificate that doesn't exist yet) can be shipped
    # to this repo without ever being loaded — only files ending literally in
    # `.enabled.conf` are included. An empty/missing directory is not an error for
    # nginx's `include` with a glob, so this is safe even before any file exists.
    # See nginx/conf.d/README.md.
    include /etc/nginx/conf.d/*.enabled.conf;

    # Redirect all HTTP → HTTPS
    # `default_server` is explicit here (not just first-block-wins) because the
    # `include /etc/nginx/conf.d/*.enabled.conf;` above can load another port-80
    # server block (e.g. HVN Global's preview vhost) ahead of this one in file
    # order. Without an explicit default_server, nginx picks whichever port-80
    # block loads first as the implicit default for unmatched Host headers / bare
    # IP requests — silently handing Havenry's fallback traffic to another site.
    server {
        listen 80 default_server;
        server_name hvnhavenry.com www.hvnhavenry.com;
        return 301 https://hvnhavenry.com$request_uri;
    }

    # Redirect www → apex
    server {
        listen 443 ssl;
        server_name www.hvnhavenry.com;

        ssl_certificate     /etc/letsencrypt/live/hvnhavenry.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hvnhavenry.com/privkey.pem;

        return 301 https://hvnhavenry.com$request_uri;
    }

    # Main site
    # default_server here too, pre-emptively: preview-global-https.disabled.conf
    # (currently inert) will also claim port 443 once TLS is activated for the
    # preview vhost — same implicit-default risk as the port 80 block above.
    server {
        listen 443 ssl default_server;
        server_name hvnhavenry.com;

        ssl_certificate     /etc/letsencrypt/live/hvnhavenry.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hvnhavenry.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Static assets — long cache. proxy_hide_header drops Next's own
        # `Cache-Control: max-age=0` so ours actually wins.
        location /_next/static/ {
            proxy_pass http://app:3000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Pulled Drive assets (images/video) are served from Next's public dir at
        # /assets/*. Filenames are stable, so cache them hard for fast repeat loads.
        location /assets/ {
            proxy_pass http://app:3000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Everything else → Next.js
        location / {
            limit_req zone=hvn burst=50 nodelay;

            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
