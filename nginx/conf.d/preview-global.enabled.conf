# Phase A preview vhost for HVN Global (rmoor-industries-ltd-co/hvnglobalco-com).
# Deliberately port 80 ONLY and serves content directly (no TLS, no redirect) --
# this file must never reference a certificate, so it is always safe for the
# deploy workflow to reload nginx with, even before a cert for
# preview.hvnglobalco.com has been obtained. See
# hvnglobalco-com/docs/deployment-linode.md's "Preview endpoint" section.
#
# ACTIVATION OF SSL (once a certificate exists — see nginx/conf.d/README.md):
# replace the contents of this file with the http->https redirect shown in
# preview-global-https.disabled.conf's own header comment, and rename that file
# to preview-global-https.enabled.conf. Do this in one commit/deploy, not two
# separate ones, so there's never a state where the redirect exists but the TLS
# block doesn't (or vice versa).
server {
    listen 80;
    server_name preview.hvnglobalco.com;

    location / {
        limit_req zone=hvn_global burst=50 nodelay;

        proxy_pass         http://app-global:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
