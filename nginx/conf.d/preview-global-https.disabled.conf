# INERT TEMPLATE — not loaded by nginx (only *.enabled.conf files are, per
# nginx.conf's `include /etc/nginx/conf.d/*.enabled.conf;`). This exists so the
# SSL config for preview.hvnglobalco.com is ready to activate the moment a
# certificate exists, without anyone having to write nginx config by hand under
# time pressure on the server.
#
# DO NOT rename this file to *.enabled.conf until
# /etc/letsencrypt/live/preview.hvnglobalco.com/fullchain.pem actually exists on
# the host — nginx will fail to start entirely (taking hvnhavenry.com down with
# it, since it's the same nginx container) if this is enabled first. See
# nginx/conf.d/README.md for the full activation sequence.
#
# ACTIVATION (once the cert exists):
#   1. Replace preview-global.enabled.conf's contents with the http->https
#      redirect block below (the "port 80" server block in this file).
#   2. mv preview-global-https.disabled.conf preview-global-https.enabled.conf
#   3. docker compose up -d --force-recreate nginx
#   4. Confirm hvnhavenry.com is still serving correctly, then confirm
#      https://preview.hvnglobalco.com/ serves HVN Global.

# Redirect HTTP -> HTTPS (moves into preview-global.enabled.conf at activation)
server {
    listen 80;
    server_name preview.hvnglobalco.com;
    return 301 https://preview.hvnglobalco.com$request_uri;
}

server {
    listen 443 ssl;
    server_name preview.hvnglobalco.com;

    ssl_certificate     /etc/letsencrypt/live/preview.hvnglobalco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.hvnglobalco.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # This is a founder-review-only preview, not yet meant for public/search-engine
    # eyes — consider adding auth_basic here once real credentials exist to hand out.

    location / {
        limit_req zone=hvn_global burst=50 nodelay;

        proxy_pass         http://app-global:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
