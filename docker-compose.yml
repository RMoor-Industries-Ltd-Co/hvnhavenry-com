services:
  app:
    build: .
    container_name: hvnhavenry_app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.local
    depends_on:
      - db
    networks:
      - havenry

  # HVN Global preview (Phase A) -- rmoor-industries-ltd-co/hvnglobalco-com, a
  # SEPARATE codebase/repo/CI pipeline, sharing only this physical box. Pulled from
  # GHCR (that repo builds and pushes it), not built here -- this repo never vendors
  # or builds hvnglobalco-com's Dockerfile. Its own env file, never hvnhavenry's;
  # its own Drive folder/manifest; see hvnglobalco-com's docs/separation-of-concerns.md.
  # `:preview` is always the noindex/no-SSL-required build -- the indexable production
  # tag is a distinct, later concern (Phase B, not this service).
  app-global:
    image: ghcr.io/rmoor-industries-ltd-co/hvnglobalco-com:preview
    container_name: hvnhavenry_app_global_preview
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.global-preview.local
    networks:
      - havenry

  # Backs Vale's interaction log + scheduled HVN<->AMG report cache (src/lib/db.ts).
  # Nothing else on this site is stateful -- the marketing pages/assets pipeline never
  # touch this database.
  db:
    image: postgres:16-alpine
    container_name: hvnhavenry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hvnhavenry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-havenry_dev_only}
      POSTGRES_DB: hvnhavenry
    volumes:
      - hvnhavenry_db_data:/var/lib/postgresql/data
    networks:
      - havenry

  nginx:
    image: nginx:alpine
    container_name: hvnhavenry_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - app-global
    networks:
      - havenry

networks:
  havenry:
    driver: bridge

volumes:
  hvnhavenry_db_data:
